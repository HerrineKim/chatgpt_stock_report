name: Scraper & Summary

on:
  schedule:
    - cron: "0 4 * * 1-5"  # KST 13:00 (월-금 오후 1시)
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      provider:
        description: "요약에 쓸 AI (비우면 저장소 변수 AI_PROVIDER, 그것도 없으면 openai)"
        type: choice
        options: ["", openai, claude]
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt pytest
    - name: Test
      run: python -m pytest -q
    - name: Run Scripts
      env:
        AI_PROVIDER: ${{ inputs.provider || vars.AI_PROVIDER || 'openai' }}
        OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scrap_and_summary.py
    - name: Commits
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto - daily report summary"
          git push origin main
        fi
    - name: Notify failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 주식 리포트 작업이 실패했습니다: ${RUN_URL}"
        fi
